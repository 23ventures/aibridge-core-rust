[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "crates/python"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "LicenseRef-Proprietary"
repository = "https://github.com/23ventures/aibridge-core"
publish = false

[workspace.dependencies]
aibridge-core = { path = "crates/core" }
async-stream = "0.3"
async-trait = "0.1"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
percent-encoding = "2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json", "stream", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
