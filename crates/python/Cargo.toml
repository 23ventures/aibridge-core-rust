[package]
name = "aibridge-core-py"
description = "Python bindings for aibridge-core (module aibridge_core._native)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
aibridge-core.workspace = true
futures-util.workspace = true
serde_json.workspace = true
pyo3 = { version = "0.30", features = ["abi3-py311"] }
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }
tokio.workspace = true

[features]
extension-module = ["pyo3/extension-module"]
